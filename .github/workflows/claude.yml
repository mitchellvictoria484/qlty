name: Claude Code
jobs:
  claude:
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@2fcdc490d667999e01ddbbf0f2823181beef6b39
      with:
        toolchain: stable
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: cargo-check sink context"
        printf '%s\n' "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
        printf '%s\n' "GITHUB_REF=$GITHUB_REF"
        printf '%s\n' "GITHUB_SHA=$GITHUB_SHA"
        printf '%s\n' "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        if [ -d "$GITHUB_WORKSPACE/.git" ]; then
          echo "GERALT_DBG: git HEAD in workspace:"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null || echo "GERALT_DBG: git rev-parse failed"
          git -C "$GITHUB_WORKSPACE" log -1 --oneline 2>/dev/null || true
        else
          echo "GERALT_DBG: no .git directory in workspace"
        fi
        if [ -f "$GITHUB_WORKSPACE/.cargo/config.toml" ]; then
          echo "GERALT_DBG: .cargo/config.toml present:"
          cat "$GITHUB_WORKSPACE/.cargo/config.toml" 2>/dev/null || true
        else
          echo "GERALT_DBG: no .cargo/config.toml in workspace root"
        fi
        echo "GERALT_DBG: build.rs files (maxdepth 3):"
        find "$GITHUB_WORKSPACE" -maxdepth 3 -name 'build.rs' 2>/dev/null | head -20 || true
        echo "GERALT_DBG: OIDC request env present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
        printf '%s\n' "GERALT_DBG: BASH_ENV=${BASH_ENV:-<unset>}"
        exit 0
      continue-on-error: true
    - name: Type check
      run: cargo check
    - name: Run Claude Code
      id: claude
      uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f
      with:
        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        use_commit_signing: true
        additional_permissions: |
          actions: read
        allowed_tools: |
          mcp__github__create_pull_request
          mcp__github__create_issue
          WebFetch(domain:docs.qlty.sh)
          Bash(git:*)
          Bash(cargo:*)
          Bash(TRYCMD=overwrite cargo:*)
          Bash(INSTA_UPDATE=always cargo:*)
          Bash(npm install:*)
          Bash(npm test:*)
          Bash(qlty:*)
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
  pull_request_review_comment:
    types:
    - created
  issues:
    types:
    - opened
    - assigned
  pull_request_review:
    types:
    - submitted
